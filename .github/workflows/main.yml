name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        # მოძებნოს სადაა settings.gradle.kts და იმ საქაღალდეში გაუშვას Build
        TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1))
        echo "Building in directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
   …
